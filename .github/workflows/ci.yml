name: CI
on:
  push:
    branches: [ main ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:
env:
  QT_VERSION: "6.9.1"
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: true
      # install-qt-action@v4 puts the matching MinGW toolchain on PATH
      # automatically for the win64_mingw arch. If mingw32-make isn't found,
      # check the action's README for the exact "tools_mingwXXXX" name that
      # ships with Qt 6.9.1 and add it under `tools:` above.

      - name: Locate CMakeLists.txt file
        id: proj
        shell: bash
        run: |
          CMAKE_FILE=$(find . -maxdepth 3 -name "CMakeLists.txt" | head -n 1)
          if [ -z "$CMAKE_FILE" ]; then
            echo "No CMakeLists.txt file found!" >&2
            exit 1
          fi
          echo "cmake_file=$CMAKE_FILE" >> "$GITHUB_OUTPUT"
          echo "cmake_dir=$(dirname "$CMAKE_FILE")" >> "$GITHUB_OUTPUT"

      - name: create build dir
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: mkdir build

      - name: configure the project
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}/build
        run: cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin

      - name: cmake (Release)
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}/build
        run: cmake --build . --parallel

      - name: Locate built exe
        id: exe
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: |
          EXE=$(find build/bin -maxdepth 1 -iname "*.exe" | head -n 1)
          if [ -z "$EXE" ]; then
          echo "No exe found in build/bin" >&2
          exit 1
          fi
          echo "exe_path=$EXE" >> "$GITHUB_OUTPUT"
          echo "exe_dir=$(dirname "$EXE")" >> "$GITHUB_OUTPUT"

      - name: windeployqt (bundle Qt DLLs)
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: windeployqt --release --compiler-runtime --qmldir . "${{ steps.exe.outputs.exe_path }}"
         
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer with Inno Setup
        shell: pwsh
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: |
          & $iscc `
          "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
          "/DMyAppExeDir=$exeDir" `
          "/Oinstaller-output" `
          "packaging\quantum.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.proj.outputs.cmake_dir }}/installer-output/*.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Locate .pro file
        id: proj
        run: |
          CMAKE_FILE=$(find . -maxdepth 3 -name "*.pro" | head -n 1)
          if [ -z "$CMAKE_FILE" ]; then
            echo "No .pro file found!" >&2
            exit 1
          fi
          echo "cmake_file=$CMAKE_FILE" >> "$GITHUB_OUTPUT"
          echo "cmake_dir=$(dirname "$CMAKE_FILE")" >> "$GITHUB_OUTPUT"

      - name: qmake (Release)
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: qmake "$(basename "${{ steps.proj.outputs.cmake_file }}")" CONFIG+=release "DEFINES+=APP_VERSION=\\\"${{ steps.ver.outputs.version }}\\\""

      - name: Build
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: make -j$(nproc)

      - name: Locate built binary
        id: bin
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: |
          BIN=$(find . -maxdepth 2 -type f -executable ! -name "*.so*" | grep -v "\.o$" | head -n 1)
          echo "bin_path=$BIN" >> "$GITHUB_OUTPUT"

      - name: Install linuxdeploy tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        env:
          QML_SOURCES_PATHS: ${{ github.workspace }}
        run: |
          mkdir -p AppDir/usr/bin
          cp "${{ steps.bin.outputs.bin_path }}" AppDir/usr/bin/Quantum
          ../linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e AppDir/usr/bin/Quantum \
            --plugin qt \
            --output appimage \
            || true
          mv Quantum*.AppImage "Quantum-${{ steps.ver.outputs.version }}-linux-x86_64.AppImage" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: ${{ steps.proj.outputs.cmake_dir }}/Quantum-*.AppImage

  package-extensions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Chrome extension version from manifest.json
        id: ext_ver_chrome
        run: |
          VERSION=$(jq -r '.version' web-integration/chrome/manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "Could not read version from chrome manifest.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Zip Chrome extension
        run: |
          cd web-integration/chrome
          zip -r "../../QDM-Integration-${{ steps.ext_ver_chrome.outputs.version }}-chrome.zip" .

      - name: Read Firefox extension version from manifest.json
        id: ext_ver_firefox
        run: |
          VERSION=$(jq -r '.version' web-integration/firefox/manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "Could not read version from firefox manifest.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Zip Firefox extension
        run: |
          cd web-integration/firefox
          zip -r "../../QDM-Integration-${{ steps.ext_ver_firefox.outputs.version }}-firefox.xpi" .

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: QDM-Integration-*-chrome.zip

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: QDM-Integration-*-firefox.xpi

  publish-release:
    needs: [ build-windows, package-extensions ] # Later add build-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Quantum ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/windows-installer/*.exe
            dist/chrome-extension/*.zip
            dist/firefox-extension/*.xpi
#           dist/linux-package/*.AppImage
