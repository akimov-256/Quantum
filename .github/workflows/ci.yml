name: CI
on:
  push:
    branches: [ main ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:
env:
  QT_VERSION: "6.9.1"
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: true
      # install-qt-action@v4 puts the matching MinGW toolchain on PATH
      # automatically for the win64_mingw arch. If mingw32-make isn't found,
      # check the action's README for the exact "tools_mingwXXXX" name that
      # ships with Qt 6.9.1 and add it under `tools:` above.

      - name: Locate CMakeLists.txt file
        id: proj
        shell: bash
        run: |
          CMAKE_FILE=$(find . -maxdepth 3 -name "CMakeLists.txt" | head -n 1)
          if [ -z "$CMAKE_FILE" ]; then
            echo "No CMakeLists.txt file found!" >&2
            exit 1
          fi
          echo "cmake_file=$CMAKE_FILE" >> "$GITHUB_OUTPUT"
          echo "cmake_dir=$(dirname "$CMAKE_FILE")" >> "$GITHUB_OUTPUT"

      - name: create build dir
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: mkdir build

      - name: configure the project
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}/build
        run: cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin

      - name: cmake (Release)
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}/build
        run: cmake --build . --parallel

      - name: Locate built Quantum.exe
        id: Quantumexe
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: |
          EXE=$(find build/bin -maxdepth 1 -iname "Quantum.exe" | head -n 1)
          if [ -z "$EXE" ]; then
          echo "No Quantum.exe found in build/bin" >&2
          exit 1
          fi
          echo "exe_path=$EXE" >> "$GITHUB_OUTPUT"
          echo "exe_dir=$(dirname "$EXE")" >> "$GITHUB_OUTPUT"

      - name: Locate built QuantumNativeHost.exe
        id: QNHexe
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: |
          EXE=$(find build/bin -maxdepth 1 -iname "QuantumNativeHost.exe" | head -n 1)
          if [ -z "$EXE" ]; then
          echo "No QuantumNativeHost.exe found in build/bin" >&2
          exit 1
          fi
          echo "exe_path=$EXE" >> "$GITHUB_OUTPUT"
          echo "exe_dir=$(dirname "$EXE")" >> "$GITHUB_OUTPUT"

      - name: windeployqt (bundle Qt DLLs) for Quantum.exe
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: windeployqt --release --compiler-runtime --qmldir . "${{ steps.Quantumexe.outputs.exe_path }}"

      - name: windeployqt (bundle Qt DLLs) for QuantumNativeHost.exe
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: windeployqt --release --compiler-runtime --qmldir . "${{ steps.QNHexe.outputs.exe_path }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
  
      - name: Build installer with Inno Setup
        shell: pwsh
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Find ISCC.exe wherever Inno Setup landed
          $iscc = Get-ChildItem -Path @(
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            ) -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

          if (-not $iscc) {
            # Fallback: search the whole Program Files trees
            $iscc = Get-ChildItem -Path "${env:ProgramFiles}","${env:ProgramFiles(x86)}" `
                    -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }

          Write-Host "Using ISCC: $iscc"

          $exeDir = (Resolve-Path "${{ steps.Quantumexe.outputs.exe_dir }}").Path
          if (-not $exeDir) { throw "exe_dir output is empty" }
  
          & $iscc `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "/DMyAppExeDir=$exeDir" `
            "/Oinstaller-output" `
            "packaging\quantum.iss"

          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.proj.outputs.cmake_dir }}/installer-output/*.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt (linux_gcc_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install build & packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libfuse2 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-cursor0 \
            patchelf

      - name: Locate CMakeLists.txt
        id: proj
        shell: bash
        run: |
          CMAKE_FILE=$(find . -maxdepth 3 -name "CMakeLists.txt" | head -n 1)
          if [ -z "$CMAKE_FILE" ]; then
            echo "No CMakeLists.txt found!" >&2
            exit 1
          fi
          echo "cmake_file=$CMAKE_FILE" >> "$GITHUB_OUTPUT"
          echo "cmake_dir=$(dirname "$CMAKE_FILE")" >> "$GITHUB_OUTPUT"

      - name: Configure (Release)
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin

      - name: Build
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: cmake --build build --parallel "$(nproc)"

      - name: Locate binary
        id: bin
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        run: |
          BIN=$(find build/bin -maxdepth 1 -type f -executable ! -name "*.so*" | head -n 1)
          if [ -z "$BIN" ]; then
            echo "No executable found under build/bin" >&2
            exit 1
          fi
          echo "bin_path=$BIN" >> "$GITHUB_OUTPUT"
          echo "bin_name=$(basename "$BIN")" >> "$GITHUB_OUTPUT"

      - name: Download linuxdeploy tools
        shell: bash
        run: |
          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Build AppImage
        shell: bash
        working-directory: ${{ steps.proj.outputs.cmake_dir }}
        env:
          # FUSE isn't available on GH runners — run AppImages by extracting them.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Tells linuxdeploy-plugin-qt where your QML sources live so it can scan imports.
          QML_SOURCES_PATHS: ${{ github.workspace }}
          # Bundle extra Qt modules you actually use (svg, network, etc.).
          EXTRA_QT_MODULES: "svg"
        run: |
          mkdir -p AppDir/usr/bin
          cp "${{ steps.bin.outputs.bin_path }}" "AppDir/usr/bin/${{ steps.bin.outputs.bin_name }}"

          "$GITHUB_WORKSPACE/linuxdeploy" \
            --appdir AppDir \
            -e "AppDir/usr/bin/${{ steps.bin.outputs.bin_name }}" \
            --plugin qt \
            --output appimage

          # linuxdeploy names the output after the .desktop file / binary.
          # Rename to a deterministic, versioned name for release.
          APPIMAGE=$(find . -maxdepth 1 -name "*.AppImage" | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "linuxdeploy did not produce an AppImage" >&2
            exit 1
          fi
          mv "$APPIMAGE" \
            "Quantum-${{ steps.ver.outputs.version }}-linux-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: ${{ steps.proj.outputs.cmake_dir }}/Quantum-*-linux-x86_64.AppImage
          if-no-files-found: error

  package-extensions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Chrome extension version from manifest.json
        id: ext_ver_chrome
        run: |
          VERSION=$(jq -r '.version' web-integration/chrome/manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "Could not read version from chrome manifest.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Zip Chrome extension
        run: |
          cd web-integration/chrome
          zip -r "../../QDM-Integration-${{ steps.ext_ver_chrome.outputs.version }}-chrome.zip" .

      - name: Read Firefox extension version from manifest.json
        id: ext_ver_firefox
        run: |
          VERSION=$(jq -r '.version' web-integration/firefox/manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "Could not read version from firefox manifest.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Zip Firefox extension
        run: |
          cd web-integration/firefox
          zip -r "../../QDM-Integration-${{ steps.ext_ver_firefox.outputs.version }}-firefox.xpi" .

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: QDM-Integration-*-chrome.zip

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: QDM-Integration-*-firefox.xpi

  publish-release:
    needs: [ build-windows, package-extensions, build-linux ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Quantum ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/windows-installer/*.exe
            dist/chrome-extension/*.zip
            dist/firefox-extension/*.xpi
            dist/linux-package/*.AppImage
